name: build-launcher

on:
  push:
    branches:
      - '**'
    # tylko zmiany w kodzie launchera wywołują build (commit z plikiem exe nie zapętla CI)
    paths:
      - 'launcher/src/**'
      - 'launcher/assets/**'
      - 'tools/make_icons.py'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobranie .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Znacznik kompilacji (SHA + data)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $code = @"
          namespace ArcaneSpire.Core
          {
              public static class BuildInfo
              {
                  public const string Sha = "$sha";
                  public const string BuiltAt = "$built";
                  public const string Channel = "launcher-latest";
              }
          }
          "@
          New-Item -ItemType Directory -Force -Path launcher/src/Core | Out-Null
          Set-Content -Path launcher/src/Core/BuildInfo.cs -Value $code -Encoding UTF8
          Write-Host "build=$sha ($built)"

      - name: Kompilacja (net48, WinForms)
        shell: pwsh
        run: |
          dotnet build launcher/src/ArcaneSpire.csproj -c Release -v minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publikacja
        shell: pwsh
        run: |
          dotnet publish launcher/src/ArcaneSpire.csproj -c Release -o out -v minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out | Format-Table Name, Length -AutoSize

      - name: Weryfikacja pliku
        shell: pwsh
        run: |
          $exe = "out/ArcaneSpire.exe"
          if (-not (Test-Path $exe)) { throw "Brak pliku $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "ArcaneSpire.exe = $size bajtów"
          if ($size -lt 30000) { throw "Plik wygląda na niepoprawny" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          Write-Host ("Produkt: " + $info.ProductName + " " + $info.ProductVersion)

          # nagłówek PE: MZ + podsystem GUI (2)
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes[0..1])
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "Nagłówek: $magic, podsystem: $subsystem (2 = aplikacja okienkowa)"
          if ($magic -ne 'MZ') { throw 'To nie jest plik wykonywalny Windows' }
          if ($subsystem -ne 2) { throw "Zły podsystem: $subsystem" }

          # ikona wbudowana w plik
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $icon) { throw 'Brak ikony w pliku exe' }
          Write-Host ("Ikona: " + $icon.Width + "x" + $icon.Height)
          $icon.Dispose()

      - name: Paczka ZIP (exe + skrypty pomocy)
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item out/ArcaneSpire.exe $stage/
          if (Test-Path out/ArcaneSpire.exe.config) { Copy-Item out/ArcaneSpire.exe.config $stage/ }
          Copy-Item launcher/uruchom.cmd $stage/
          Copy-Item launcher/diagnostyka.cmd $stage/
          Copy-Item launcher/diagnostyka.ps1 $stage/
          @"
          ARCANE SPIRE
          ============
          1. Kliknij dwa razy uruchom.cmd  (uruchamia launcher i pokazuje, co sie stalo, jesli okno sie nie pojawi)
          2. Albo uruchom bezposrednio ArcaneSpire.exe
          3. Jesli cos nie dziala: diagnostyka.cmd -> na pulpicie powstanie diagnostyka.txt

          Wymagania: Windows 10 (1903+) lub Windows 11. .NET Framework 4.8 jest czescia systemu.
          Podglad: https://github.com/Agama12345/gta
          "@ | Set-Content -Path "$stage/CZYTAJ-NAJPIERW.txt" -Encoding UTF8
          Compress-Archive -Path "$stage/*" -DestinationPath out/ArcaneSpire.zip -Force
          Get-ChildItem out | Format-Table Name, Length -AutoSize

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneSpire-exe
          path: |
            out/ArcaneSpire.exe
            out/ArcaneSpire.zip
          if-no-files-found: error

      - name: Kopia do repozytorium (downloads/ArcaneSpire.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item out/ArcaneSpire.exe downloads/ArcaneSpire.exe -Force
          Copy-Item out/ArcaneSpire.zip downloads/ArcaneSpire.zip -Force

      - name: Commit kopii (bez ponownego builda)
        shell: pwsh
        run: |
          git config user.name "Arcane Spire Build"
          git config user.email "build@users.noreply.github.com"
          git add downloads/ArcaneSpire.exe downloads/ArcaneSpire.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Bez zmian."; exit 0 }
          git commit -m "build: launcher ${{ github.sha }} [skip ci]"
          git push

      - name: Wydanie launcher-latest (zawsze aktualny link do pobrania)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          gh release view launcher-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create launcher-latest --target "${{ github.ref_name }}" `
              --title "Arcane Spire — najnowszy build" `
              --notes "build=$sha`nZawsze najświeższy launcher (Windows 10/11, .NET Framework 4.8 wbudowany)."
          }
          gh release upload launcher-latest out/ArcaneSpire.exe --clobber
          gh release upload launcher-latest out/ArcaneSpire.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "Nie udało się wgrać pliku do wydania" }
          gh release edit launcher-latest --notes "build=$sha`nzbudowano: $built`npliki: ArcaneSpire.exe`n`nPobierz: https://github.com/Agama12345/gta/releases/download/launcher-latest/ArcaneSpire.exe"
